[project]
name = "ailo-footage"
version = "0.1.0"
description = "AILO long-form footage indexing, triage, and multi-cam synchronization package"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "scenedetect>=0.6",
    "faster-whisper>=1.0.0",
]

[project.scripts]
footage = "footage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["footage"]
