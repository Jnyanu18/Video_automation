<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      body { font-family: "Helvetica Neue", Arial, "DejaVu Sans", sans-serif; }
      #g { position: absolute; top:177px; right:177px; background: rgba(15,15,15,0.88); border-radius: 39px; padding: 46px 78px;
            text-align: center; box-shadow: 0 8px 36px rgba(0,0,0,.3); border-bottom: 14px solid #ff7a1a; }
      #val { font-size: 213px; font-weight: 900; color: #ff7a1a; line-height: 1; letter-spacing: -0.03em; }
      #lbl { font-size: 78px; font-weight: 700; color: #ffffff; margin-top: 14px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="graphic-o16" data-start="0" data-duration="4.6"
         data-width="1080" data-height="1920">
      <div id="g" class="clip" data-start="0" data-duration="4.6" data-track-index="0">
        <div id="lbl">Easy: put AI inside a product</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      gsap.set("#g", { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" });
      tl.to("#g", { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.7)" }, 0.05);
      if (document.getElementById("val")) {
        var v = document.getElementById("val"), target = v.textContent, m = target.match(/^([^0-9]*)([0-9][0-9,.]*)(.*)$/);
        if (m) { var num = parseFloat(m[2].replace(/,/g, "")), o = { n: 0 }, dec = (m[2].split(".")[1] || "").length;
          tl.to(o, { n: num, duration: 0.9, ease: "power2.out", onUpdate: function () { v.textContent = m[1] + o.n.toFixed(dec) + m[3]; } }, 0.2);
          tl.set(v, { textContent: target }, 1.15); }
      }
      tl.to("#g", { opacity: 0, scale: 0.9, duration: 0.25, ease: "power2.in" }, 4.3);
      window.__timelines["graphic-o16"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
