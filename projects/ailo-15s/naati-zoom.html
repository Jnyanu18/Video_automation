<!doctype html>
<html><head><meta charset="utf-8"><title>Naati Roots Speed Edit</title>
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}svg{display:block}</style></head><body>
<svg id="v" xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script>
'use strict';
/* NAATI ROOTS - speed edit replicating instagram reel DKP4zphtItA (quentin._fx style).
   Its exact cut times (~97 BPM, one cut per beat), its letterbox intro that snaps on the 8ths,
   a zoom-through with radial blur on every cut, and a last shot that runs into the first so it loops.
   Pure function of t: seek(t) draws the frame, prepare(t) decodes the slots it needs first. */
const W=1080,H=1920,CX=540,CY=960,v=document.getElementById('v');
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x, seg=(t,t0,d)=>clamp((t-t0)/d);
const eo=x=>x>=1?1:1-Math.pow(2,-10*x), ei=x=>x<=0?0:Math.pow(2,10*x-10);
const n2=x=>(Math.round(x*100)/100).toString();

const DUR=8.7;
const CUTS=[0.0,1.30,1.97,2.57,3.20,3.83,4.43,5.03,5.60,6.27,6.83,7.43,8.10,8.70];   /* the reference's own cut times */
const SPEED=[1,1.5,1.5,1.5,1.5,1.5,1.5,1.5,1.5,1.5,1.5,1.5,1];
const COUNT=[40,32,28,30,30,28,29,27,32,27,28,32,19];
const FR=(s,k)=>`naati/zoom/z${String(s).padStart(2,'0')}_${String(k).padStart(3,'0')}.jpg`;
const frameOf=(s,u)=>FR(s,clamp(Math.floor(u*30*SPEED[s]),0,COUNT[s]-1));

/* Zoom blur by accumulation: N copies, each a little larger, layer i at opacity 1/(i+1) so every
   copy weighs the same. strength 0..1; at 1 the copies span +24% scale, a hard radial smear. */
function zoomed(href,scale,strength,cx=CX,cy=CY){const N=strength>.02?7:1;let g='';
  for(let i=0;i<N;i++){const sc=scale*(1+i*.04*strength);
    g+=`<image href="${href}" x="0" y="0" width="${W}" height="${H}" preserveAspectRatio="xMidYMid slice" decoding="sync"${i?` opacity="${(1/(i+1)).toFixed(3)}"`:''} transform="translate(${cx} ${cy}) scale(${sc.toFixed(4)}) translate(${-cx} ${-cy})"/>`;}
  return g;}

/* intro: the picture plays in a full-width letterbox that snaps to a new height on each 8th */
const SNAP=[0,.35,.70,1.01],BOX=[[.13,.74,1.0],[.34,.36,1.1],[.40,.24,1.32],[.30,.43,1.15]];  /* [top, height, image zoom] */
function intro(t){let j=0;for(let q=1;q<4;q++)if(t>=SNAP[q])j=q;
  const e=eo(seg(t,SNAP[j],.1)),a=BOX[Math.max(0,j-1)],b=BOX[j],m=j?e:1,lp=(x,y)=>x+(y-x)*m;
  const top=lp(a[0],b[0])*H,h=lp(a[1],b[1])*H,z=lp(a[2],b[2])*(1+.04*seg(t,0,1.3)),bl=j?(1-e):0;
  const out=ei(seg(t,1.20,.10));   /* zoom-through into the first full-frame cut */
  return `<defs><clipPath id="box"><rect x="0" y="${n2(top)}" width="${W}" height="${n2(h)}"/></clipPath></defs>`+
         `<g clip-path="url(#box)">${zoomed(frameOf(0,t),z*(1+.3*out),Math.max(bl*.6,out))}</g>`;}

/* a full-frame shot: slam in large and blurred, a gentle push, then zoom through into the next cut */
function shot(s,u,len){const slam=1-eo(seg(u,0,.16)),out=ei(seg(u,len-.10,.10));
  const sc=(1+.32*slam)*(1+.06*seg(u,0,len))*(1+.25*out);
  return zoomed(frameOf(s,u),sc,Math.max(slam,out));}

window.seek=function(T0){const t=clamp(T0,0,DUR-1e-6);let s=0;for(let i=1;i<CUTS.length-1;i++)if(t>=CUTS[i])s=i;
  const u=t-CUTS[s],len=CUTS[s+1]-CUTS[s];
  const body=s===0?intro(t):shot(s,u,len);
  /* a little extra saturation and contrast: the reference's grass is very punchy, our footage is dustier */
  v.innerHTML=`<defs><filter id="g" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="1.22"/><feComponentTransfer><feFuncR type="linear" slope="1.06" intercept="-.02"/><feFuncG type="linear" slope="1.06" intercept="-.02"/><feFuncB type="linear" slope="1.06" intercept="-.02"/></feComponentTransfer></filter></defs>`+
    `<rect width="${W}" height="${H}" fill="#000"/><g filter="url(#g)">${body}</g>`;};

/* decode only the slots around t: this one and the next two */
const CACHE=new Map();
function load(s){if(CACHE.has(s))return CACHE.get(s).ready;const imgs=[];for(let k=0;k<COUNT[s];k++){const i=new Image();i.src=FR(s,k);imgs.push(i);}
  const ready=Promise.all(imgs.map(i=>i.decode().catch(()=>{})));CACHE.set(s,{imgs,ready});return ready;}
window.prepare=function(T0){const t=clamp(T0,0,DUR-1e-6);let s=0;for(let i=1;i<CUTS.length-1;i++)if(t>=CUTS[i])s=i;
  const need=new Set([s,s+1,s+2].filter(x=>x<COUNT.length));
  for(const k of [...CACHE.keys()])if(!need.has(k))CACHE.delete(k);
  return Promise.all([...need].map(load)).then(()=>true);};

/* ---------- soundtrack: a 97 BPM beat on the reference's cut grid (the AILO reel's instruments) ----------
   Stands in for the reference's music, which belongs to its rights holder. Because the cuts sit on the
   reference's beat grid, the original sound can be attached in Instagram ("Use audio") and the cuts land. */
window.renderAudio=async()=>{
  const SR=48000,ctx=new OfflineAudioContext(2,Math.round(SR*DUR),SR),bus=ctx.createGain();bus.gain.value=.7;
  const comp=ctx.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=6;comp.ratio.value=4;comp.attack.value=.003;comp.release.value=.15;bus.connect(comp);comp.connect(ctx.destination);
  let sd=11;const R=()=>(sd=(sd*16807)%2147483647)/2147483647*2-1;const nb=ctx.createBuffer(1,SR*2,SR),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=R();
  const env=(g,t,pk,att,dec)=>{const a=Math.max(att,.001);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(pk,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+dec);};
  const out=(n,p)=>{const P=ctx.createStereoPanner();P.pan.value=p;n.connect(P);P.connect(bus);};
  function noise(t,dur,type,f,q,g,p=0,att=.002,f2){const s=ctx.createBufferSource();s.buffer=nb;s.loop=true;const fl=ctx.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+att+dur);fl.Q.value=q;const a=ctx.createGain();env(a,t,g,att,dur);s.connect(fl);fl.connect(a);out(a,p);s.start(t,(t*.731)%1.2);s.stop(t+att+dur+.05);}
  const tone=(t,f,g,dur,type='sine',p=0,f2)=>{const o=ctx.createOscillator(),a=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);env(a,t,g,.004,dur);o.connect(a);out(a,p);o.start(t);o.stop(t+dur+.05);};
  const kick=(t,g)=>{tone(t,170,g,.38,'sine',0,44);noise(t,.012,'highpass',3000,.7,.25*g);};
  const clap=(t,g)=>{noise(t,.14,'bandpass',1800,1.1,.5*g);noise(t+.012,.1,'bandpass',2400,1.4,.3*g);};
  const bass=(t,f,d)=>{const o=ctx.createOscillator();o.type='sawtooth';o.frequency.value=f;const fl=ctx.createBiquadFilter();fl.type='lowpass';fl.Q.value=5;fl.frequency.setValueAtTime(1100,t);fl.frequency.exponentialRampToValueAtTime(120,t+d);const a=ctx.createGain();env(a,t,.2,.006,d);o.connect(fl);fl.connect(a);a.connect(bus);o.start(t);o.stop(t+d+.05);};
  /* intro: a tick on each letterbox snap, a pad, a riser into the first cut */
  SNAP.forEach((x,j)=>tone(x+.005,880*Math.pow(2,j/5),.09,.18,'triangle',j%2?.3:-.3));
  [220,329.6,440].forEach((f,i)=>tone(0,f,.035,1.3,'sine',(i-1)*.35));
  noise(.6,.66,'bandpass',300,2,.28,0,.6,7000);
  const ROOT=[55,55,43.65,43.65,65.41,65.41,49,49];
  for(let i=1;i<CUTS.length-1;i++){const t=CUTS[i],len=CUTS[i+1]-t;
    kick(t,i===1?1.1:.9);if(i%2===0)clap(t,.8);
    noise(t+len/2,.04,'highpass',8500,.7,.09,i%2?-.25:.25);
    bass(t,ROOT[(i-1)%8],len*.8);
    noise(t+len-.12,.12,'bandpass',500,1.5,.2,0,.1,6500);   /* whoosh into the zoom-through */
  }
  const buf=await ctx.startRendering(),L=buf.getChannelData(0),Rr=buf.getChannelData(1);let pk=0;for(let i=0;i<L.length;i++)pk=Math.max(pk,Math.abs(L[i]),Math.abs(Rr[i]));
  const gn=pk>0?.89/pk:1,n=L.length,ab=new ArrayBuffer(44+n*4),dv=new DataView(ab),ws=(o,str)=>{for(let i=0;i<str.length;i++)dv.setUint8(o+i,str.charCodeAt(i));};
  ws(0,'RIFF');dv.setUint32(4,36+n*4,true);ws(8,'WAVE');ws(12,'fmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,2,true);dv.setUint32(24,SR,true);dv.setUint32(28,SR*4,true);dv.setUint16(32,4,true);dv.setUint16(34,16,true);ws(36,'data');dv.setUint32(40,n*4,true);
  for(let i=0,o=44;i<n;i++,o+=4){dv.setInt16(o,Math.max(-1,Math.min(1,L[i]*gn))*32767,true);dv.setInt16(o+2,Math.max(-1,Math.min(1,Rr[i]*gn))*32767,true);}
  const u8=new Uint8Array(ab);let bin='';for(let i=0;i<u8.length;i+=32768)bin+=String.fromCharCode.apply(null,u8.subarray(i,i+32768));return btoa(bin);};

window.prepare(0).then(()=>{window.seek(0);window.READY=true;});
</script>
</body></html>
